name: check-examples

# Run on pushes to main, all pull requests
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-examples:
    name: Check Examples
    runs-on: ubuntu-latest
    steps:
      # checkout + build
      - uses: actions/checkout@v3
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      # See https://github.com/Swatinem/rust-cache
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      # compile the examples + check for changes
      - name: Compile all tests
        run: ./tests/compile-tests.sh
      - name: Check for any changes
        run: ./tests/check-for-changes.sh
      # TODO: Tests require .so files built via ./scripts/build-test-programs.sh
      # This needs Anchor CLI + Solana CLI installed. For now, tests run with continue-on-error.
      - name: Run parity tests
        run: cargo test --manifest-path tests/common/Cargo.toml
        continue-on-error: true
      - name: Run integration tests
        run: cargo test --manifest-path tests/integration/Cargo.toml
        continue-on-error: true
