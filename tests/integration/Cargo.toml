[package]
name = "seahorse-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "seahorse_integration_tests"
path = "lib.rs"

[dependencies]
# LiteSVM for integration testing (0.6.1 uses Solana 2.2 modular crates)
litesvm = "=0.6.1"

# Solana modular crates (matching litesvm 0.6.1 requirements)
solana-account = "2.2"
solana-clock = "2.2"
solana-hash = "2.2"
solana-sha256-hasher = "2.2"
solana-instruction = "2.2"
solana-keypair = "2.2"
solana-message = "2.2"
solana-native-token = "2.2"
solana-pubkey = "2.2"
solana-rent = "2.2"
solana-sdk-ids = "2.2"
solana-signature = "2.2"
solana-signer = "2.2"
solana-transaction = "2.2"

# For Borsh serialization (matching Anchor's version)
borsh = "0.10"

# Note: anchor-litesvm 0.2.0 requires anchor-lang 0.31.1 which differs from
# Seahorse's anchor-lang 0.32.1. We'll implement helpers without anchor-litesvm
# for SDK compatibility. Future work can add anchor-litesvm when versions align.

[[test]]
name = "integration_tests"
path = "tests.rs"

[[test]]
name = "counter_integration"
path = "counter_integration.rs"
