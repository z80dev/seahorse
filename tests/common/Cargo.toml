[package]
name = "seahorse-test-common"
version = "0.1.0"
edition = "2021"
publish = false
description = "Common test utilities for comparing Seahorse and Anchor program behavior"

[lib]
name = "seahorse_test_common"
path = "lib.rs"

[dependencies]
# LiteSVM for running both program versions (0.6.1 uses Solana 2.2 modular crates)
litesvm = "=0.6.1"

# Solana modular crates (matching litesvm 0.6.1 requirements)
solana-account = "2.2"
solana-clock = "2.2"
solana-hash = "2.2"
solana-sha256-hasher = "2.2"
solana-instruction = "2.2"
solana-keypair = "2.2"
solana-message = "2.2"
solana-native-token = "2.2"
solana-pubkey = "2.2"
solana-rent = "2.2"
solana-sdk-ids = "2.2"
solana-signature = "2.2"
solana-signer = "2.2"
solana-transaction = "2.2"

# For Borsh serialization (matching Anchor's version)
borsh = "0.10"

# For colored output
colored = "2.1"

[[test]]
name = "compare_tests"
path = "tests.rs"

[[test]]
name = "counter_parity"
path = "counter_parity.rs"

[[test]]
name = "hello_world_parity"
path = "hello_world_parity.rs"

[[test]]
name = "calculator_parity"
path = "calculator_parity.rs"
