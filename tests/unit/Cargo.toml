[package]
name = "seahorse-unit-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "seahorse_unit_tests"
path = "lib.rs"

[dependencies]
# Solana SDK for types and accounts (using 2.2 for mollusk 0.1.3 compatibility)
solana-sdk = "=2.2.1"
# Pin other Solana crates to match mollusk requirements
solana-bpf-loader-program = "=2.2.1"
solana-compute-budget = "=2.2.1"
solana-program-runtime = "=2.2.1"
solana-system-program = "=2.2.1"
# Borsh for serialization
borsh = "0.10"
# Bincode for sysvar serialization
bincode = "1.3"
# Mollusk for fast unit testing (0.1.3 uses Solana 2.2)
mollusk-svm = "=0.1.3"

[[test]]
name = "unit_tests"
path = "tests.rs"

[[test]]
name = "counter_tests"
path = "counter_tests.rs"

[[test]]
name = "calculator_tests"
path = "calculator_tests.rs"
