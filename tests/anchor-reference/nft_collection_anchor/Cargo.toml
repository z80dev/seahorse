[package]
name = "nft_collection_anchor"
version = "0.1.0"
description = "NFT collection with verified membership - Anchor reference implementation"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "nft_collection_anchor"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.0"
anchor-spl = { version = "0.32.0", features = ["metadata"] }
mpl-token-metadata = "5.0.0"
