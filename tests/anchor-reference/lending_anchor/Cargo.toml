[package]
name = "lending_anchor"
version = "0.1.0"
description = "Simplified lending protocol with collateralization"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lending_anchor"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.0"
anchor-spl = "0.32.0"

# Pin blake3 to avoid edition 2024 requirement
blake3 = "=1.8.2"
