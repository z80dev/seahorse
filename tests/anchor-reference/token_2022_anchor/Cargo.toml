[package]
name = "token_2022_anchor"
version = "0.1.0"
description = "Token-2022 interest-bearing mint - Anchor reference implementation"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "token_2022_anchor"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.0"
anchor-spl = { version = "0.32.0", features = ["token_2022_extensions"] }
spl-token-2022 = { version = "6", features = ["no-entrypoint"] }
