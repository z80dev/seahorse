[package]
name = "multisig_anchor"
version = "0.1.0"
description = "Multisig wallet - Anchor reference for Seahorse parity testing"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "multisig_anchor"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.0"

[dev-dependencies]
anchor-client = "0.32.0"
