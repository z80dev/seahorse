[package]
name = "auction_anchor"
version = "0.1.0"
description = "Anchor reference implementation of auction with time-based state transitions"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "auction_anchor"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.0"
anchor-spl = "0.32.0"

[dev-dependencies]
blake3 = "=1.8.2"
