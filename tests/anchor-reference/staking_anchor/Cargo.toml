[package]
name = "staking_anchor"
version = "0.1.0"
description = "Token staking reference program (Anchor version)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "staking_anchor"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
init-if-needed = []

[dependencies]
anchor-lang = { version = "0.32.0", features = ["init-if-needed"] }
anchor-spl = "0.32.0"
