[package]
name = "calculator_anchor"
version = "0.1.0"
description = "Calculator reference program (Anchor version) with enum operations"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "calculator_anchor"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.0"
